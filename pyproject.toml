[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b4p"
version = "2.0.0"
description = "Blueprints for Pangaea medical-supply inventory database"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "gspread>=6.0",          # read the sheet with a service account
    "google-auth>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
b4p = "b4p.cli:main"

[tool.setuptools]
packages = ["b4p"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["live: hits the real Google Sheet / Render feeds (run with -m live)"]
addopts = "-m 'not live'"
